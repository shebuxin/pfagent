name: Bug Report
description: Report a reproducible bug in the app, training pipeline, or verification suite.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - text-to-sim app
        - fine-tuning pipeline
        - verification suite
        - docs / repo structure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include commands, prompts, filenames, and settings when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

